[build]
  command = "npm run build"
  publish = "out"

# The old site served its home page at /home; keep its search ranking and backlinks by redirecting permanently.
# Must sit above the 404 catch-all, since Netlify uses the first matching rule.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# Old site's login page; the adviser portal login now lives on the portal domain
[[redirects]]
  from = "/contacts/sign_in"
  to = "https://portal.kenekt.com.au/login"
  status = 301
  force = true

# Old site's sign-up page; sign-up now lives on the portal domain
[[redirects]]
  from = "/contacts/sign_up"
  to = "https://portal.kenekt.com.au/sign_up"
  status = 301
  force = true

# The Keystatic editor is a single exported page that routes in the browser
[[redirects]]
  from = "/keystatic/*"
  to = "/keystatic.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
